<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#07070d">
<title>Student+ · Your student life, upgraded.</title>
<style>
:root{
  --bg:#07070d; --paper:#07070d; --s1:#101019; --s2:#171724; --s3:#20203a;
  --ink:#f4f3ff; --muted:#a3a1bf; --line:rgba(255,255,255,.11); --line2:rgba(255,255,255,.2);
  --blue:#4f6bff; --violet:#9b5cff; --violet2:#b98bff; --grad:linear-gradient(135deg,#4f6bff 0%,#9b5cff 100%);
  --lime:#d7ff3a; --pink:#ff5ccf;
  --ok:#5ff0a6; --okbg:rgba(95,240,166,.1); --warn:#ffc46b; --warnbg:rgba(255,196,107,.1); --red:#ff6b6b;
  --r:18px;
  --font: "Inter", "SF Pro Display", "Segoe UI Variable Display", "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{margin:0;font-family:var(--font);color:var(--ink);background:var(--bg);line-height:1.5;font-size:16px;overflow-x:hidden;overflow-wrap:break-word;word-wrap:break-word;padding-bottom:88px;-webkit-font-smoothing:antialiased}
body:before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(520px 380px at 0% -5%,rgba(79,107,255,.28),transparent 70%),radial-gradient(480px 380px at 100% 10%,rgba(155,92,255,.24),transparent 70%),radial-gradient(600px 400px at 50% 110%,rgba(155,92,255,.12),transparent 70%)}
body.nobar{padding-bottom:0}
button,input{font:inherit;color:inherit}
h1,h2,h3,h4,p{margin:0}
svg{display:block}
::selection{background:var(--violet);color:#fff}
.wrap{width:100%;max-width:1040px;margin:0 auto;padding:0 16px}

/* Header */
.top{position:sticky;top:0;z-index:30;background:rgba(7,7,13,.78);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:10px;padding-top:12px;padding-bottom:12px}
.logo{border:0;background:none;padding:2px 0;font-weight:800;font-size:1.3rem;letter-spacing:-.04em;cursor:pointer;display:flex;align-items:center}
.logo span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:900;margin-left:1px}
.end{margin-left:auto;border:1px solid var(--line2);background:transparent;border-radius:999px;padding:7px 14px;font-weight:600;font-size:.85rem;cursor:pointer;min-height:38px;color:var(--ink)}
.notice{background:rgba(255,255,255,.04);border-bottom:1px solid var(--line);color:var(--muted);text-align:center;font-size:.78rem;padding:5px 12px;font-weight:500;letter-spacing:.01em}

/* Bottom tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(10,10,18,.86);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);display:flex;justify-content:center;gap:6px;padding:8px 10px calc(8px + env(safe-area-inset-bottom))}
.tabbar .nav{flex:1 1 0;max-width:130px;min-width:0;border:0;background:none;border-radius:14px;padding:6px 4px;min-height:54px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;line-height:1.1;position:relative;color:var(--muted)}
.tabbar .nav svg{width:22px;height:22px}
.tabbar .nav .mono{width:24px;height:24px;border-radius:7px;font-size:.62rem}
.tabbar .nav span{font-size:.72rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tabbar .nav.on{color:var(--ink);background:rgba(255,255,255,.07)}
.tabbar .nav.on:after{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 4px 4px;background:var(--grad)}
.tabbar .pill{position:absolute;top:4px;right:calc(50% - 22px);min-width:18px;height:18px;border-radius:999px;background:var(--violet);color:#fff;font-size:.68rem;font-weight:800;display:grid;place-items:center}

/* Generic */
main{padding:22px 0 40px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:14px;padding:12px 18px;min-height:50px;font-weight:700;font-size:1rem;cursor:pointer;text-align:center;line-height:1.2;max-width:100%;transition:transform .08s,box-shadow .15s,background .15s;background:rgba(255,255,255,.08);color:var(--ink)}
.btn:active{transform:scale(.98)}
.btn-primary,.btn-violet{background:var(--grad);color:#fff;box-shadow:0 8px 26px rgba(110,90,255,.35)}
.btn-lime{background:var(--lime);color:#0b0b12}
.btn-ink,.btn-white{background:#fff;color:#0b0b12}
.btn-soft{background:rgba(255,255,255,.08);color:var(--ink)}
.btn-line{background:transparent;color:var(--ink);border-color:var(--line2)}
.btn-wide{width:100%}
.btn-sm{min-height:42px;padding:8px 14px;font-size:.92rem}
.btn[disabled]{opacity:.38;cursor:not-allowed;box-shadow:none;transform:none}
.linkbtn{border:0;background:none;padding:10px 4px;min-height:44px;color:var(--ink);text-decoration:underline;text-decoration-color:var(--line2);text-decoration-thickness:1px;text-underline-offset:5px;font-weight:600;font-size:.98rem;cursor:pointer;text-align:center}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;flex-wrap:wrap;gap:10px}
.small{font-size:.86rem;color:var(--muted)}
.muted{color:var(--muted)}
.center{text-align:center}
.mt{margin-top:14px}.mb{margin-bottom:14px}
.card{background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.025));border:1px solid var(--line);border-radius:var(--r);padding:20px;min-width:0}
.badge{display:inline-block;font-size:.7rem;font-weight:700;padding:3px 9px;border-radius:999px;background:rgba(255,255,255,.08);color:var(--ink);letter-spacing:.04em;text-transform:uppercase}
.badge.ok{background:rgba(95,240,166,.12);color:var(--ok)}
.badge.off{background:rgba(255,255,255,.06);color:var(--muted)}
.badge.pause{background:var(--warnbg);color:var(--warn)}
.section-title{font-size:clamp(1.6rem,6vw,2.3rem);font-weight:800;letter-spacing:-.045em;margin:4px 0 14px;line-height:1.05}
.h3{font-size:1.15rem;font-weight:800;margin:26px 0 10px;letter-spacing:-.02em}
.eyebrow{display:block;font-size:.72rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--violet2);margin-bottom:8px}
.sticker{display:inline-block;background:rgba(215,255,58,.1);color:var(--lime);border:1px solid rgba(215,255,58,.35);border-radius:999px;padding:4px 11px;font-weight:700;font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
.sticker.pink{background:rgba(255,92,207,.1);color:var(--pink);border-color:rgba(255,92,207,.35)}
.sticker.white{background:rgba(255,255,255,.1);color:#fff;border-color:var(--line2)}
.hl{color:var(--lime)}
.hl-v{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.mono{flex:0 0 auto;display:grid;place-items:center;border-radius:14px;font-weight:900;letter-spacing:-.04em;color:#fff}
.disc{font-size:.78rem;color:var(--muted);border:1px dashed var(--line2);border-radius:12px;padding:8px 12px;margin:12px 0}

/* Marquee */
.marquee{overflow:hidden;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:22px 0;white-space:nowrap;font-weight:800;letter-spacing:.14em;font-size:.78rem;color:var(--muted)}
.marquee div{display:inline-block;padding:12px 0;animation:mq 26s linear infinite}
.marquee b{color:var(--lime);font-weight:800}
@keyframes mq{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.marquee div,.typing span,.hold,.spin,.peek .arrow{animation:none}}

/* Intro slides */
.intro{max-width:560px;margin:0 auto}
.slide{border:1px solid var(--line);border-radius:26px;padding:26px 22px 22px;position:relative;overflow:hidden;min-height:min(72vh,620px);display:flex;flex-direction:column;background:#0d0d17}
.slide:before{content:"";position:absolute;width:420px;height:420px;border-radius:50%;right:-180px;top:-200px;filter:blur(10px);opacity:.9}
.slide.s0:before{background:radial-gradient(closest-side,rgba(79,107,255,.65),transparent)}
.slide.s1:before{background:radial-gradient(closest-side,rgba(79,107,255,.6),transparent)}
.slide.s2:before{background:radial-gradient(closest-side,rgba(155,92,255,.65),transparent)}
.slide.s3:before{background:radial-gradient(closest-side,rgba(215,255,58,.35),transparent)}
.slide.s4:before{background:radial-gradient(closest-side,rgba(255,92,207,.45),transparent)}
.slide h1{font-size:clamp(2.4rem,11vw,3.6rem);line-height:.96;font-weight:900;letter-spacing:-.055em;position:relative;margin-top:14px}
.slide p{font-size:1.08rem;font-weight:500;margin-top:14px;position:relative;color:#d3d1ea;max-width:420px}
.slide .sart{flex:1;display:flex;align-items:center;justify-content:center;margin:20px 0;position:relative;min-height:170px}
.slide .kicker{position:relative}
.sdots{display:flex;gap:6px;justify-content:center;margin:16px 0 12px}
.sdots i{width:8px;height:8px;border-radius:99px;background:rgba(255,255,255,.2)}
.sdots i.on{width:26px;background:var(--grad)}
.stack3{position:relative;width:min(100%,320px);height:210px}
.stack3 .pc{position:absolute;width:66%;padding:14px 16px;border-radius:16px;font-weight:800;font-size:1.15rem;background:rgba(255,255,255,.07);border:1px solid var(--line2);backdrop-filter:blur(8px);display:flex;align-items:center;gap:10px;box-shadow:0 20px 40px rgba(0,0,0,.45)}
.stack3 .pc small{display:block;font-size:.76rem;font-weight:500;color:var(--muted)}
.stack3 .pc.a{left:0;top:6px}.stack3 .pc.b{right:0;top:76px}.stack3 .pc.c{left:9%;top:146px}
.bigprice{font-size:clamp(3rem,16vw,5rem);font-weight:900;letter-spacing:-.06em;line-height:1;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.fan{display:flex;justify-content:center;width:100%}
.fan>div{width:34%;margin:0 -3%;border-radius:12px;overflow:hidden;box-shadow:0 20px 40px rgba(0,0,0,.55);border:1px solid var(--line2)}
.fan>div:nth-child(1){transform:rotate(-7deg) translateY(10px)}
.fan>div:nth-child(2){transform:translateY(-6px);z-index:2}
.fan>div:nth-child(3){transform:rotate(7deg) translateY(10px)}

/* Home */
.hero{border:1px solid var(--line);border-radius:26px;padding:30px 22px;position:relative;overflow:hidden;margin-bottom:8px;background:#0d0d17}
.hero:before{content:"";position:absolute;width:460px;height:460px;right:-200px;top:-220px;border-radius:50%;background:radial-gradient(closest-side,rgba(155,92,255,.55),transparent)}
.hero:after{content:"";position:absolute;width:380px;height:380px;left:-180px;bottom:-240px;border-radius:50%;background:radial-gradient(closest-side,rgba(79,107,255,.5),transparent)}
.hero>*{position:relative;z-index:1}
.hero h1{font-size:clamp(2.3rem,9.5vw,4rem);line-height:.96;letter-spacing:-.055em;font-weight:900;max-width:640px;margin-top:14px}
.hero p{margin-top:14px;font-size:1.06rem;color:#d3d1ea;max-width:520px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:16px}
.plan{display:flex;flex-direction:column;gap:12px}
.plan-head{display:flex;align-items:center;gap:12px}
.icon{flex:0 0 auto;width:50px;height:50px;border-radius:14px;display:grid;place-items:center;font-size:.95rem;font-weight:900;letter-spacing:-.04em;color:#fff}
.i-watch{background:linear-gradient(135deg,#4f6bff,#2b3fd6)}
.i-life{background:linear-gradient(135deg,#9b5cff,#6a2ee8)}
.i-study{background:linear-gradient(135deg,#5b7bff,#b05cff)}
.i-news{background:linear-gradient(135deg,#d7ff3a,#8be04a);color:#0b0b12}
.plan h3{font-size:1.4rem;font-weight:800;letter-spacing:-.035em}
.tagline{font-weight:600;color:#d3d1ea}
.perks{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
.perks li{padding-left:26px;position:relative;color:#d3d1ea}
.perks li:before{content:"";position:absolute;left:2px;top:.5em;width:12px;height:7px;border-left:2px solid var(--lime);border-bottom:2px solid var(--lime);transform:rotate(-45deg)}
.pricebig{font-size:2.5rem;font-weight:900;letter-spacing:-.05em;line-height:1}
.pricebig small{font-size:.95rem;font-weight:600;color:var(--muted);letter-spacing:0}
.minis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.minis>div{border-radius:10px;overflow:hidden;min-width:0}
.minis .poster,.minis .cover{box-shadow:none;border-radius:0}
.minis svg,.fan svg{width:100%;height:100%}
.active-note{background:var(--okbg);color:var(--ok);font-weight:700;border-radius:12px;padding:10px 12px;border:1px solid rgba(95,240,166,.3)}
.limit-note{background:rgba(255,255,255,.04);border:1px dashed var(--line2);border-radius:12px;padding:10px 12px;font-size:.9rem;color:var(--muted)}
.spacer{flex:1}
.bundle{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;position:relative;border-color:rgba(155,92,255,.5);background:linear-gradient(135deg,rgba(79,107,255,.18),rgba(155,92,255,.22))}
.bundle .sticker{position:absolute;top:-12px;right:16px;background:#0d0d17}
@media (min-width:720px){.bundle{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);align-items:center}}
.peek{text-align:center;margin:44px 0 18px}
.peek .arrow{display:block;margin:10px auto 0;width:2px;height:34px;background:linear-gradient(var(--lime),transparent);animation:bob 1.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(6px)}}
.free{border:1px solid rgba(215,255,58,.3);border-radius:26px;padding:24px 18px;scroll-margin-top:90px;background:linear-gradient(180deg,rgba(215,255,58,.07),rgba(255,255,255,.02))}
.free h2{font-size:clamp(1.9rem,8vw,3rem);font-weight:900;letter-spacing:-.05em;line-height:1}
.free-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:14px;margin-top:18px}
.free-item{border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px;background:rgba(7,7,13,.55)}
.free-item .plan-head h3{font-size:1.2rem;font-weight:800}
.freeline{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:10px 0;font-weight:600}
.freeline b{font-size:1.35rem;font-weight:900;color:var(--lime)}

/* Subscriptions */
.sub{display:flex;flex-direction:column;gap:12px}
.sub-head{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.sample{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.sample ul{margin:6px 0 0;padding-left:20px}
.empty{text-align:center;padding:32px 20px}

/* Onboarding */
.ob{max-width:620px;margin:0 auto}
.dots{display:flex;gap:6px;justify-content:center;margin-bottom:16px}
.dots i{width:8px;height:8px;border-radius:999px;background:rgba(255,255,255,.18)}
.dots i.on{width:26px;background:var(--grad)}
.ob h2{font-size:1.8rem;font-weight:900;letter-spacing:-.045em;margin-bottom:8px;line-height:1.05}
.ob .art{margin:18px 0}
.pick{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}
.pick button{border:1px solid var(--line2);background:transparent;border-radius:999px;padding:9px 15px;min-height:44px;font-weight:600;cursor:pointer;color:var(--ink)}
.pick button.sel{background:var(--grad);border-color:transparent;color:#fff}
.celebrate{width:72px;height:72px;border-radius:22px;background:var(--grad);font-size:2rem;display:grid;place-items:center;margin:4px auto 16px;font-weight:900;color:#fff;box-shadow:0 10px 30px rgba(110,90,255,.45)}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.g3>*,.g2>*{min-width:0}
.devices{display:flex;align-items:flex-end;justify-content:center;gap:14px;padding:10px 0}
.laptop{width:min(62%,280px)}
.laptop .scr{border:7px solid #2a2a40;border-radius:10px 10px 0 0;overflow:hidden;aspect-ratio:16/10;background:#000}
.laptop .base{height:10px;background:#2a2a40;border-radius:0 0 10px 10px;margin:0 -14px}
.phone{width:min(24%,96px);border:5px solid #2a2a40;border-radius:16px;overflow:hidden;aspect-ratio:9/17;background:#000}
.scr svg,.phone svg{width:100%;height:100%}
.match{position:relative}
.match span{position:absolute;left:6px;top:6px;background:rgba(7,7,13,.8);color:var(--lime);font-size:.68rem;font-weight:800;padding:2px 7px;border-radius:999px;border:1px solid rgba(215,255,58,.4)}
.meter{background:rgba(255,255,255,.08);border-radius:999px;height:8px;overflow:hidden;margin:6px 0 12px}
.meter i{display:block;height:100%;background:var(--grad)}
.ticket{border:1px solid var(--line2);border-radius:20px;background:linear-gradient(135deg,rgba(79,107,255,.2),rgba(155,92,255,.2));padding:16px;position:relative;text-align:left}
.ticket:before,.ticket:after{content:"";position:absolute;top:50%;width:20px;height:20px;border-radius:50%;background:#101019;border:1px solid var(--line2)}
.ticket:before{left:-11px}.ticket:after{right:-11px}
.tk-row{display:flex;flex-wrap:wrap;gap:10px 18px;margin-top:14px;border-top:1px dashed var(--line2);padding-top:12px}
.tk-row>div{flex:1 1 auto}
.tk-row b{display:block;font-size:1.05rem;font-weight:800;white-space:nowrap;overflow-wrap:normal}
.statbox{border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;background:rgba(255,255,255,.04)}
.statbox b{font-size:2rem;font-weight:900;letter-spacing:-.05em;line-height:1}
.statbox span{font-weight:600;font-size:.88rem;color:var(--muted)}
.statbox.s0 b{color:#8aa0ff}.statbox.s1 b{color:var(--lime)}.statbox.s2 b{color:var(--pink)}.statbox.s3 b{color:var(--violet2)}

/* Hub */
.hubhead{border:1px solid var(--line);border-radius:22px;padding:18px;display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-bottom:18px;position:relative;overflow:hidden;background:#0d0d17}
.hubhead:before{content:"";position:absolute;width:300px;height:300px;right:-120px;top:-160px;border-radius:50%;background:radial-gradient(closest-side,rgba(155,92,255,.5),transparent)}
.hubhead.hh-watch:before{background:radial-gradient(closest-side,rgba(79,107,255,.6),transparent)}
.hubhead>*{position:relative}
.hubhead h2{font-size:1.6rem;font-weight:900;letter-spacing:-.04em;white-space:nowrap}
.hubhead .grow{min-width:150px}
@media (max-width:430px){.hubhead .btn{width:100%}}
.feature{display:grid;grid-template-columns:minmax(0,130px) minmax(0,1fr);gap:16px;align-items:center;background:#0d0d17;border:1px solid var(--line);border-radius:22px;padding:16px;overflow:hidden}
.feature h3{font-size:1.45rem;font-weight:900;line-height:1.05;letter-spacing:-.04em}
.feature p{color:#d3d1ea;margin:6px 0 12px;font-size:.95rem}
@media (min-width:640px){.feature{grid-template-columns:minmax(0,180px) minmax(0,1fr)}}
.rowsec{margin-top:24px}
.rowsec h3{font-size:1.1rem;font-weight:800;margin-bottom:10px;letter-spacing:-.02em}
.scroller{display:flex;gap:12px;overflow-x:auto;padding:2px 6px 12px 2px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
.tile{flex:0 0 128px;border:0;background:none;padding:0;text-align:left;cursor:pointer;scroll-snap-align:start;color:var(--ink)}
.poster{border-radius:10px;overflow:hidden;box-shadow:0 10px 24px rgba(0,0,0,.45);aspect-ratio:2/3;background:#222}
.poster svg{width:100%;height:100%}
.tname{display:block;font-weight:700;font-size:.88rem;margin-top:8px;line-height:1.25}
.tmeta{display:block;font-size:.78rem;color:var(--muted)}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 4px 8px 2px;margin-bottom:12px}
.tabs button{flex:0 0 auto;border:1px solid var(--line2);background:transparent;border-radius:999px;padding:8px 16px;min-height:42px;font-weight:600;cursor:pointer;color:var(--ink)}
.tabs button.on{background:#fff;color:#0b0b12;border-color:#fff}
.perkgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr));gap:12px}
.perk{border:1px solid var(--line);background:rgba(255,255,255,.04);border-radius:16px;overflow:hidden;text-align:left;padding:0;cursor:pointer;display:flex;flex-direction:column;color:var(--ink)}
.perk .pa{aspect-ratio:16/10}
.perk .pa svg{width:100%;height:100%}
.perk .pb{padding:10px 12px 12px}
.perk .deal{font-weight:700;line-height:1.25;font-size:.95rem}
.brand{display:block;font-weight:900;letter-spacing:-.02em;font-size:1rem;margin-bottom:2px}

    if (P.view === 'simple') {
      if (P.ex === 'active') inner = '<div class="step-top">' + iconBox('watch', 44) + '<div><b>Watch+</b><br><span class="badge ok">Active</span></div></div><h2>Manage plan</h2><p class="muted mb">Example account · separate from the class demo</p><button class="btn btn-primary btn-wide" data-a="pCancel">Cancel subscription</button>';
      else if (P.ex === 'confirm') inner = '<h2>Cancel Watch+?</h2><p class="muted mb">Your subscription will end now.</p><div class="stack"><button class="btn btn-primary btn-wide" data-a="pConfirm">Confirm cancellation</button><button class="btn btn-soft btn-wide" data-a="pBack">Go back</button></div>';
      else inner = '<div class="result"><div class="mark ok">✓</div><h2>Subscription cancelled</h2><p class="muted" style="margin:6px 0 14px">Two taps. That’s it.</p><button class="btn btn-soft btn-wide" data-a="pResetEx">Reset this example</button></div>';
      body = '<div class="simple"><button class="linkbtn" data-a="pPanel">← Back to presenter panel</button><div class="card flow" style="margin-top:8px">' + inner + '</div></div>';
    } else {
      body = '<h2 class="section-title">Presenter controls</h2><p class="muted" style="margin:-6px 0 14px">These buttons only affect this browser, not your classmates’ phones.</p>' +
        (P.msg ? '<div class="okmsg" role="status">' + esc(P.msg) + '</div>' : '') + '<div class="pgrid">' +
        '<div class="card pcard"><h3>1. Reset this browser</h3><p class="muted">Clears the demo and the example account in this browser only.</p><button class="btn btn-line btn-wide" data-a="pReset">Reset session</button></div>' +
        '<div class="card pcard"><h3>2. Open the normal demo</h3><p class="muted">The same page your classmates see, without presenter controls.</p><button class="btn btn-primary btn-wide" data-a="pOpen">Open demo</button></div>' +
        '<div class="card pcard"><h3>3. Simple cancellation (closing)</h3><p class="muted">Separate example account: Cancel subscription → confirm → cancelled.</p><button class="btn btn-primary btn-wide" data-a="pSimple">Show simple version</button></div>' +
        '</div>' + resultsHTML(S);
    }
    return top + '<main><div class="wrap">' + body + '</div></main>';
  }

  /* ================= Render ================= */
  var appEl = document.getElementById('app');
  function render(scroll) {
    var body;
    if (isPresenter) { document.body.className = 'nobar'; appEl.innerHTML = renderPresenter(); }
    else {
      if (S.view === 'intro') body = viewIntro();
      else if (S.view === 'subs') body = viewSubs();
      else if (S.view === 'onboard') body = viewOnboard();
      else if (S.view === 'hub') body = viewHub();
      else if (S.view === 'item') body = viewItem();
      else if (S.view === 'flow') body = viewFlow();
      else if (S.view === 'ended') body = viewEnded();
      else body = viewPlans();
      var bar = S.view !== 'intro' && S.view !== 'ended';
      document.body.className = bar ? '' : 'nobar';
      appEl.innerHTML = header() + '<main><div class="wrap">' + body + '</div></main>' + (bar ? bottomNav() : '') + (sheet === 'news' ? newsSheetHTML() : sheet ? sheetHTML() : '');
    }
    if (scroll) window.scrollTo(0, 0);
  }
  function scrollToFree() {
    var el = document.getElementById('free');
    if (el) { try { el.scrollIntoView({ behavior: 'smooth', block: 'start' }); } catch (e) { el.scrollIntoView(); } }
  }

  /* ================= Actions ================= */
  function newFlow(id, prev) { return { id: Date.now() + Math.random(), plan: id, i: -1, more: false, sel: {}, code: '', typed: '', msg: '', chat: [], node: 'n0', typing: false, pend: null, menu: 'main', art: null, res: null, kept: null, start: prev ? prev.start : Date.now(), taps: prev ? prev.taps : 0 }; }
  function keepPlan(f, kind) {
    S.c.kept++; f.kept = kind; f.typing = false; f.res = 'kept';
    if (kind === 'pause') S.plans[f.plan] = 'paused';
  }

  function startPlan(p) {
    if (isLive(p) || liveCount() >= 2) { render(); return; }
    S.plans[p] = 'active'; S.tEnd[p] = Date.now() + 30 * 864e5; S.c.trials++; S.cur = p; S.ob = 0; S.view = 'onboard'; save(); render(true); toast('✓ Your trial is active.');
  }
  function handle(a, d) {
    var f = S.flow, v = d.v, p = d.p;
    if (S.view === 'flow' && f && !f.res && a !== 'go' && a !== 'end' && a !== 'open') { S.c.taps++; f.taps++; }
    switch (a) {
      case 'slide': S.slide = Math.max(0, Math.min(SLIDES.length - 1, S.slide + (+v))); save(); render(true); return;
      case 'introDone': S.view = 'plans'; save(); render(true); return;
      case 'pay': sheet = 'pay'; render(); return;
      case 'newsTog': newsOpt = !newsOpt; render(); return;
      case 'newsJoin': if (!newsOpt || !pendingPlan) return; S.plans.news = 'active'; S.c.news++; sheet = false; startPlan(pendingPlan); return;
      case 'unsub':
        if (S.plans.news !== 'active') return;
        S.flow = newFlow('news'); S.flow.i = 0; enterStep(S.flow); S.flow.taps = 1; S.c.taps++; S.view = 'flow'; save(); render(true); return;
      case 'closeSheet': sheet = false; render(); return;
      case 'toFree': sheet = false; render(); scrollToFree(); return;
      case 'toFreeHome': S.view = 'plans'; S.flow = null; S.item = null; save(); render(); scrollToFree(); return;
      case 'go': S.view = v; S.flow = null; S.item = null; save(); render(true); return;
      case 'start':
        if (isLive(p) || liveCount() >= 2) { render(); return; }
        if (S.plans.news !== 'active') { pendingPlan = p; newsOpt = true; sheet = 'news'; render(); return; }
        startPlan(p); return;
      case '__start':
        S.plans[p] = 'active'; S.tEnd[p] = Date.now() + 30 * 864e5; S.c.trials++; S.cur = p; S.ob = 0; S.view = 'onboard'; save(); render(true); toast('✓ Your trial is active.'); return;
      case 'obNext': S.ob = Math.min(S.ob + 1, 5); save(); render(true); return;
      case 'obSkip': S.view = 'hub'; save(); render(true); return;
      case 'obInt': toggle(S.ints[S.cur], v); save(); render(); return;
      case 'open': if (!isLive(p)) { render(); return; } S.cur = p; S.view = 'hub'; S.item = null; S.flow = null; save(); render(true); return;
      case 'item': S.item = { k: d.k, i: d.k === 'note' ? v : +v }; S.view = 'item'; save(); render(true); return;
      case 'back': S.view = 'hub'; S.item = null; save(); render(true); return;
      case 'mylist': toggle(S.myList, +v); save(); render(); toast(has(S.myList, +v) ? 'Added to My List' : 'Removed from My List', true); return;
      case 'going': toggle(S.going, +v); save(); render(); return;
      case 'used': if (!has(S.usedP, +v)) { S.usedP.push(+v); toast('Perk used (simulated)'); } save(); render(); return;
      case 'read': if (!has(S.readS, +v)) S.readS.push(+v); save(); render(); return;
      case 'lcat': S.lcat = v; save(); render(); return;
      case 'stab': S.stab = v; save(); render(); return;
      case 'fcflip': S.fc.flip = !S.fc.flip; save(); render(); return;
      case 'fcmark': if (v === 'got') S.fc.got++; else S.fc.again++; S.fc.i = (S.fc.i + 1) % CARDS.length; S.fc.flip = false; save(); render(); return;
      case 'fcmove': S.fc.i = (S.fc.i + (+v) + CARDS.length) % CARDS.length; S.fc.flip = false; save(); render(); return;
      case 'qstart': S.qz = { q: +v, n: 0, ans: null, score: 0, done: false }; S.item = { k: 'quiz', i: +v }; S.view = 'item'; save(); render(true); return;
      case 'qans': if (S.qz.ans != null) return; S.qz.ans = +v; if (+v === QUIZ[S.qz.q].q[S.qz.n][2]) S.qz.score++; save(); render(); return;
      case 'qnext': S.qz.ans = null; if (S.qz.n + 1 < QUIZ[S.qz.q].q.length) S.qz.n++; else S.qz.done = true; save(); render(true); return;

      case 'manage': if (!isLive(p)) return; S.flow = newFlow(p); S.flow.taps = 1; S.c.taps++; S.view = 'flow'; save(); render(true); return;
      case 'na': toast('This option isn’t available in this demo.', true); return;
      case 'more': if (f) { f.more = !f.more; save(); render(); } return;
      case 'cancelStart': if (!f) return; S.c.attempts++; f.i = 0; enterStep(f); save(); render(true); return;
      case 'sel': if (!f) return; f.sel[d.k] = +v; save(); render(); return;
      case 'tick': if (!f) return; f.sel[d.k] = !f.sel[d.k]; save(); render(); return;
      case 'trap': if (!f) return; f.sel[f.i + 't'] = (f.sel[f.i + 't'] === false); save(); render(); return;
      case 'fnext':
        if (!f || f.res) return;
        var st = STEPS[f.plan][f.i];
        if (st.ty === 'trap' && f.sel[f.i + 't'] !== false) { keepPlan(f, 'trap'); save(); render(true); return; }
        if (!stepOk(f, st)) { render(); return; }
        advance(f); save(); render(true); return;
      case 'keep': if (!f || f.res) return; keepPlan(f, v); save(); render(true); return;
      case 'retry': if (!f || !isLive(f.plan)) return; S.flow = newFlow(f.plan, f); if (f.plan === 'news') { S.flow.i = 0; enterStep(S.flow); } save(); render(true); return;
      case 'confirmCancel':
        if (!f || f.res || !isLive(f.plan)) return;
        if (f.plan === 'news') S.c.unsub++; else S.c.cancelled++;
        S.plans[f.plan] = 'cancelled'; f.res = 'done'; f.end = Date.now(); f.typing = false;
        S.c.log.push({ p: f.plan === 'news' ? 'Student+ Drop newsletter (unsubscribe)' : PLANS[f.plan].name, s: Math.max(1, Math.round((f.end - f.start) / 1000)), taps: f.taps });
        save(); render(true); return;
      case 'key':
        if (!f) return;
        if (v === 'del') f.code = f.code.slice(0, -1);
        else if (f.code.length < 4) {
          f.code += v; f.msg = '';
          if (f.code.length === 4 && f.code !== STEPS[f.plan][f.i].code) { f.msg = 'That code is not correct. Check your inbox and try again.'; f.code = ''; }
        }
        save(); render(); return;
      case 'ivr':
        if (!f) return; f.msg = '';
        if (f.menu === 'main') {
          if (v === '0') f.menu = 'more';
          else if (v === '1') f.msg = 'New perks are added every Monday! Returning to the main menu.';
          else if (v === '2') f.msg = 'Your trial is free. No payment is due. Returning to the main menu.';
          else if (v === '3') f.msg = 'Our partner list is in the app. Returning to the main menu.';
          else f.msg = 'Invalid option. Please try again.';
        } else if (f.menu === 'more') {
          if (v === '4') f.menu = 'hold';
          else if (v === '9') f.menu = 'main';
          else if (v === '1') { f.msg = 'To pause your plan, please use the app. Returning to the main menu.'; f.menu = 'main'; }
          else if (v === '2' || v === '3') { f.msg = 'This line is closed right now. Returning to the main menu.'; f.menu = 'main'; }
          else f.msg = 'Invalid option. Please try again.';
        }
        save(); render(); return;
      case 'help':
        if (!f) return;
        if (v === 'list') { f.art = null; f.msg = ''; }
        else { var art = HELP[+v]; if (art.ok) { f.art = 'ok'; f.msg = ''; } else f.msg = art.t + ': ' + art.a; }
        save(); render(); return;
      case 'reply':
        if (!f || f.typing) return;
        var r = CH[f.node].r[+v];
        f.chat.push({ from: 'user', text: r.t });
        if (r.keep) { keepPlan(f, r.keep); save(); render(true); return; }
        if (r.step) { advance(f); save(); render(true); return; }
        f.typing = true; f.pend = { say: r.say, to: r.to }; save(); render(); return;
      case 'end': sheet = false; S.view = 'ended'; S.flow = null; S.item = null; save(); render(true); return;
      case 'restart': S = fresh(); save(); render(true); return;

      case 'pReset': store.del(KEY); store.del(KEY_P); S = fresh(); P = freshP(); P.msg = 'Done: this browser’s session was reset.'; saveP(); render(true); return;
      case 'pOpen': window.location.href = window.location.pathname; return;
      case 'pSimple': P.view = 'simple'; P.msg = ''; saveP(); render(true); return;
      case 'pPanel': P.view = 'panel'; saveP(); render(true); return;
      case 'pCancel': P.ex = 'confirm'; saveP(); render(); return;
      case 'pBack': P.ex = 'active'; saveP(); render(); return;
      case 'pConfirm': P.ex = 'cancelled'; saveP(); render(); return;
      case 'pResetEx': P.ex = 'active'; saveP(); render(); return;
    }
  }

  document.addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('[data-a]') : null;
    if (!b || b.disabled) return;
    if (b.classList.contains('overlay') && e.target.closest('[data-stop]')) return;
    handle(b.getAttribute('data-a'), { v: b.getAttribute('data-v'), p: b.getAttribute('data-p'), k: b.getAttribute('data-k') });
  });
  document.addEventListener('input', function (e) {
    if (e.target && e.target.id === 'typein' && S.flow) {
      S.flow.typed = e.target.value; save();
      var st = STEPS[S.flow.plan][S.flow.i], btn = document.getElementById('fgo');
      if (btn) btn.disabled = !stepOk(S.flow, st);
    }
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && e.target && e.target.id === 'typein') { var btn = document.getElementById('fgo'); if (btn && !btn.disabled) btn.click(); }
    if (e.key === 'Escape' && sheet) { sheet = false; render(); }
  });
  // Swipe between intro slides
  var tx = null, ty = null;
  document.addEventListener('touchstart', function (e) { if (S.view !== 'intro' || !e.target.closest('#slides')) { tx = null; return; } tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, { passive: true });
  document.addEventListener('touchend', function (e) {
    if (tx == null || S.view !== 'intro') return;
    var dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty; tx = null;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) {
      if (dx < 0 && S.slide < SLIDES.length - 1) handle('slide', { v: '1' });
      else if (dx > 0 && S.slide > 0) handle('slide', { v: '-1' });
    }
  }, { passive: true });

  render();
})();
</script>
</body>
</html>
